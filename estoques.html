<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque - WMS Prime Logística</title>
<style>*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172b4d;margin:0;padding:20px}
h1{background:#123b70;color:white;padding:20px;border-radius:12px;font-size:24px}
h2{font-size:20px;margin-top:25px}
input{display:block;width:100%;padding:14px;margin:12px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#1763b1;color:white;border:0;border-radius:8px;padding:14px;margin:5px 5px 5px 0;font-size:16px}
#resultado{background:white;padding:16px;border-radius:10px;min-height:60px}
</style>
</head>
<body>
<h1>Controle de Estoque</h1>
<p>WMS Prime Logística</p>
  <h2>Movimentação de Estoque</h2>
<input id="produto" placeholder="Código do produto">
<input id="quantidade" type="number" min="1" placeholder="Quantidade">
<button onclick="movimentar('entrada')">Entrada</button>
<button onclick="movimentar('saida')">Saída</button>
<h2>Saldo em Estoque</h2>
<div id="resultado"></div>
<script>
const estoque = JSON.parse(localStorage.getItem('prime_estoque') || '{}');
  
const produtos = JSON.parse(
  localStorage.getItem('prime-wms-demo-produtos-v1') || '[]'
);

function identificarProduto(codigo) {
  const busca = codigo.trim().toUpperCase();
  const produto = produtos.find(p =>
    p.interno === busca || p.ean === busca
  );
  return produto ? (produto.ean || produto.interno) : busca;
}

function movimentar(tipo) {

const codigo = identificarProduto(
  document.getElementById('produto').value
);
  const qtd = Number(document.getElementById('quantidade').value);
  if (!codigo || !Number.isInteger(qtd) || qtd <= 0) {
    alert('Informe produto e quantidade válida');
    return;
  }
  const atual = estoque[codigo] || 0;
  if (tipo === 'saida' && qtd > atual) {
    alert('Estoque insuficiente');
    return;
  }
  estoque[codigo] = atual + (tipo === 'entrada' ? qtd : -qtd);
  localStorage.setItem('prime_estoque', JSON.stringify(estoque));
  mostrar();
}
function mostrar() {
  document.getElementById('resultado').innerHTML =
    Object.entries(estoque).map(([codigo, qtd]) =>
      '<p>' + codigo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + ': ' + qtd + '</p>'
    ).join('');
}
mostrar();
  
const CHAVE_PRODUTOS = 'prime-wms-demo-produtos-v1';

function integrarProdutos() {
  let produtos = [];
  try {
    produtos = JSON.parse(
      localStorage.getItem(CHAVE_PRODUTOS) || '[]'
    );
  } catch (erro) {
    console.error('Erro ao carregar cadastro', erro);
    return;
  }

  if (!Array.isArray(produtos)) return;
  let alterado = false;

  produtos.forEach(p => {
    const codigo = String(p.interno || '').trim().toUpperCase();
    const ean = String(p.ean || '').trim();
    const chave = ean || codigo;
    if (!chave) return;

    const inicial = Number(p.quantidade);
    if (
      !Object.prototype.hasOwnProperty.call(estoque, chave) &&
      Number.isSafeInteger(inicial) &&
      inicial >= 0
    ) {
      estoque[chave] = inicial;
      alterado = true;
    }
  });

  if (alterado) {
    localStorage.setItem('prime_estoque', JSON.stringify(estoque));
  }
  mostrar();
}

integrarProdutos();
  
</script>
</body>
</html>
